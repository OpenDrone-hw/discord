# Cloudflare Worker for the OpenDrone Discord bot. See README.md for setup.
# Secrets are never written here; set each with `npx wrangler secret put <NAME>`:
#   DISCORD_PUBLIC_KEY DISCORD_BOT_TOKEN DISCORD_CLIENT_ID DISCORD_CLIENT_SECRET
#   GITHUB_APP_ID GITHUB_APP_PRIVATE_KEY GITHUB_WEBHOOK_SECRET
#   GITHUB_OAUTH_CLIENT_ID GITHUB_OAUTH_CLIENT_SECRET SESSION_SECRET
# Optional: DISCORD_POSTING ("off" stops GitHub posting to Discord; README "Kill switch").
name = "opendrone-discord-bot"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = true

[vars]
GUILD_ID = "1494019459822653512"
APPLICATION_ID = "1553826696673759344"
PROMOTE_ENABLED = "false"
# Team slug for the maintainer linked-role metadata: the org team "core" holds the maintainers.
GITHUB_MAINTAINER_TEAM = "core"

[[d1_databases]]
binding = "DB"
database_name = "opendrone-discord-bot"
database_id = "47c7c4ee-2ccc-4434-9aa8-ceedf8d9d044"
migrations_dir = "migrations"

[triggers]
# Linked-role metadata refresh, every 6 hours.
crons = ["17 */6 * * *"]

[observability]
enabled = true
